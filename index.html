<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Web SCADA - Công Phong</title>
    <!-- Tải thư viện MQTT cho trình duyệt -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #2c3e50; 
            text-align: center; 
            color: #ecf0f1; 
            margin-top: 50px;
        }
        .container { 
            max-width: 600px; 
            margin: 0 auto; 
            background: #34495e; 
            padding: 30px; 
            border-radius: 12px; 
            box-shadow: 0 10px 20px rgba(0,0,0,0.5); 
        }
        .status { font-weight: bold; color: #f39c12; margin-bottom: 20px; font-size: 18px;}
        
        /* Box hiển thị trạng thái mạng 4G */
        .network-box {
            background: #2980b9;
            border-radius: 8px;
            padding: 15px 20px;
            margin-bottom: 20px;
            font-size: 16px;
            text-align: left;
            display: flex;
            justify-content: space-between;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.2);
        }
        .network-box span { font-weight: bold; color: #f1c40f; }

        .data-box { 
            background: #1abc9c; 
            border-radius: 10px; 
            padding: 40px; 
            margin: 20px 0; 
            box-shadow: inset 0 0 10px rgba(0,0,0,0.2);
        }
        .value { font-size: 80px; font-weight: bold; color: white; margin: 10px 0 0 0; text-shadow: 2px 2px 4px rgba(0,0,0,0.3);}
        .btn { 
            border: none; 
            padding: 15px 40px; 
            font-size: 20px; 
            font-weight: bold;
            color: white; 
            border-radius: 8px; 
            cursor: pointer; 
            margin: 10px; 
            transition: 0.2s; 
        }
        .btn-on { background-color: #27ae60; border-bottom: 5px solid #1e8449; }
        .btn-on:active { transform: translateY(5px); border-bottom: 0; }
        .btn-off { background-color: #e74c3c; border-bottom: 5px solid #c0392b; }
        .btn-off:active { transform: translateY(5px); border-bottom: 0; }
    </style>
</head>
<body>
    <div class="container">
        <h1>HỆ THỐNG GIÁM SÁT S7-1200</h1>
        <div id="status" class="status">Đang kết nối đến MQTT Broker... ⏳</div>

        <!-- BẢNG THÔNG TIN MẠNG 4G TỪ MODULE SIM -->
        <div class="network-box">
            <div>🌍 Trạng thái: <span id="sim_status">Đang cập nhật...</span></div>
            <div>📶 Sóng (CSQ): <span id="sim_signal">--</span>/31</div>
        </div>

        <div class="data-box">
            <p style="margin: 0; font-size: 22px; text-transform: uppercase;">Dữ liệu Thanh ghi</p>
            <p id="plc_value" class="value">---</p>
        </div>

        <div>
            <button class="btn btn-on" onclick="sendCmd('1')">BẬT ĐÈN</button>
            <button class="btn btn-off" onclick="sendCmd('0')">TẮT ĐÈN</button>
        </div>
    </div>

    <script>
        // 1. Cấu hình MQTT
        var broker = "broker.hivemq.com";
        var port = 8884; 
        var clientId = "WebClient_Phong_" + Math.floor(Math.random() * 10000);
        
        var client = new Paho.MQTT.Client(broker, port, clientId);

        // 2. Xử lý khi mất kết nối
        client.onConnectionLost = function(responseObject) {
            document.getElementById("status").innerText = "Mất kết nối MQTT! ❌";
            document.getElementById("status").style.color = "#e74c3c";
            // Làm mờ thông số mạng khi mất kết nối
            document.getElementById("sim_status").innerText = "Mất mạng";
            document.getElementById("sim_signal").innerText = "--";
        };

        // 3. Xử lý khi nhận được dữ liệu (Từ ESP32 bắn lên)
        client.onMessageArrived = function(message) {
            var topic = message.destinationName;
            var payload = message.payloadString;

            if(topic === "congphong/plc/sensor") {
                document.getElementById("plc_value").innerText = payload;
            } 
            // Kênh nhận trạng thái kết nối mạng
            else if (topic === "congphong/plc/sim_status") {
                document.getElementById("sim_status").innerText = payload;
                if(payload.includes("Online")) {
                    document.getElementById("sim_status").style.color = "#2ecc71"; // Màu xanh
                } else {
                    document.getElementById("sim_status").style.color = "#e74c3c"; // Màu đỏ
                }
            }
            // Kênh nhận cường độ sóng
            else if (topic === "congphong/plc/signal") {
                document.getElementById("sim_signal").innerText = payload;
            }
        };

        // 4. Bắt đầu kết nối
        client.connect({
            useSSL: true, 
            onSuccess: function() {
                document.getElementById("status").innerText = "Đã kết nối thành công! ✅";
                document.getElementById("status").style.color = "#2ecc71";
                
                // Lắng nghe kênh cảm biến
                client.subscribe("congphong/plc/sensor");
                // Lắng nghe thêm 2 kênh của Module SIM
                client.subscribe("congphong/plc/sim_status");
                client.subscribe("congphong/plc/signal");
            }
        });

        // 5. Hàm gửi lệnh khi bấm nút
        function sendCmd(cmd) {
            if (client.isConnected()) {
                var message = new Paho.MQTT.Message(cmd);
                message.destinationName = "congphong/plc/led";
                client.send(message);
            } else {
                alert("Chưa kết nối được với hệ thống mạng!");
            }
        }
    </script>
</body>
</html>
